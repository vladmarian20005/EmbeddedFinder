[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-finder"
version = "0.1.0"
description = "Semantic file search powered by Google Gemini embeddings"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vlad Marian"}]
keywords = ["semantic-search", "embeddings", "gemini", "vector-search", "file-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "chromadb>=0.4.0",
    "click>=8.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
    "watchdog>=3.0",
    "PyPDF2>=3.0",
    "python-docx>=1.0",
    "flask>=3.0",
    "Pillow>=10.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
efind = "embedded_finder.cli:cli"

[project.urls]
Homepage = "https://github.com/vladmarian20005/EmbeddedFinder"
Repository = "https://github.com/vladmarian20005/EmbeddedFinder"
Issues = "https://github.com/vladmarian20005/EmbeddedFinder/issues"

[tool.setuptools.packages.find]
include = ["embedded_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
