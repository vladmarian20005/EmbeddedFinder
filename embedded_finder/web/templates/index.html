<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmbeddedFinder - Semantic File Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .search-box input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #38bdf8; }
        .search-box button {
            padding: 0.75rem 1.5rem;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover { background: #7dd3fc; }
        .search-box button:disabled { background: #475569; cursor: not-allowed; }
        .status { text-align: center; color: #64748b; margin: 1rem 0; font-size: 0.85rem; }
        .results-count { color: #94a3b8; margin-bottom: 1rem; font-size: 0.9rem; }
        .result-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .result-card:hover { border-color: #38bdf8; }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .file-name {
            font-weight: 600;
            color: #f1f5f9;
            font-size: 1rem;
        }
        .score {
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .score-high { background: #166534; color: #4ade80; }
        .score-med { background: #854d0e; color: #fbbf24; }
        .score-low { background: #991b1b; color: #fca5a5; }
        .file-path {
            color: #64748b;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }
        .file-meta {
            display: flex;
            gap: 1rem;
            color: #64748b;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .snippet {
            color: #94a3b8;
            font-size: 0.85rem;
            line-height: 1.4;
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 4px;
            max-height: 80px;
            overflow: hidden;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .copied {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #166534;
            color: #4ade80;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .copied.show { opacity: 1; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #475569;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>EmbeddedFinder</h1>
        <p class="subtitle">Semantic file search powered by Google Gemini embeddings</p>

        <div class="search-box">
            <input type="text" id="query" placeholder="Describe what you're looking for..."
                   autofocus autocomplete="off">
            <button id="searchBtn" onclick="doSearch()">Search</button>
        </div>

        <div id="status" class="status"></div>
        <div id="results"></div>
    </div>
    <div id="copied" class="copied">Path copied!</div>

    <script>
        const queryInput = document.getElementById('query');
        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');
        const searchBtn = document.getElementById('searchBtn');
        const copiedDiv = document.getElementById('copied');

        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // Load status on page load
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                statusDiv.textContent = `${data.unique_files} files indexed (${data.documents} chunks)`;
            })
            .catch(() => {
                statusDiv.textContent = 'No index found. Use CLI to index files first.';
            });

        async function doSearch() {
            const query = queryInput.value.trim();
            if (!query) return;

            searchBtn.disabled = true;
            searchBtn.innerHTML = '<span class="spinner"></span>';
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, n_results: 20 }),
                });
                const data = await res.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<p class="status">${data.error}</p>`;
                    return;
                }

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<p class="status">No results found.</p>';
                    return;
                }

                let html = `<p class="results-count">${data.count} result(s) for "${escHtml(query)}"</p>`;
                for (const r of data.results) {
                    const scorePct = (r.score * 100).toFixed(0);
                    let scoreClass = 'score-low';
                    if (r.score >= 0.85) scoreClass = 'score-high';
                    else if (r.score >= 0.70) scoreClass = 'score-med';

                    const size = formatSize(r.file_size);
                    html += `
                        <div class="result-card" onclick="copyPath('${escHtml(r.file_path)}')">
                            <div class="result-header">
                                <span class="file-name">${escHtml(r.file_name)}</span>
                                <span class="score ${scoreClass}">${scorePct}%</span>
                            </div>
                            <div class="file-path">${escHtml(r.file_path)}</div>
                            <div class="file-meta">
                                <span>${escHtml(r.file_extension)}</span>
                                <span>${size}</span>
                            </div>
                            ${r.snippet ? `<div class="snippet">${escHtml(r.snippet)}</div>` : ''}
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
            } catch (err) {
                resultsDiv.innerHTML = `<p class="status">Error: ${err.message}</p>`;
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        }

        function copyPath(path) {
            navigator.clipboard.writeText(path).then(() => {
                copiedDiv.classList.add('show');
                setTimeout(() => copiedDiv.classList.remove('show'), 1500);
            });
        }

        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
    </script>
</body>
</html>
